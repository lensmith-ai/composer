<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src &#x27;none&#x27;; style-src &#x27;sha256-50KNc2e8n4LHSQd6c9V7KQBwksrEX3ShQiLXB+4kpCo=&#x27;; script-src &#x27;sha256-JULgDHGiNmIvittkDb3cT+AdX1Nn+GM91PNdn9qP2js=&#x27;; img-src &#x27;none&#x27;; form-action &#x27;none&#x27;; base-uri &#x27;none&#x27;">
<meta name="referrer" content="no-referrer">
<title>Composer, replayed</title>
<style>:root{--ground:#0b0e13;--panel:#10141b;--panel2:#151a23;--ink:rgba(255,255,255,.92);--ink2:rgba(255,255,255,.64);--line:rgba(255,255,255,.1);--amber:#ffb020;--green:#48d1a0;--red:#ff6b6b;--mark:rgba(255,176,32,.16)}
@media (prefers-color-scheme:light){:root{--ground:#f6f5f1;--panel:#fff;--panel2:#f0eee8;--ink:#16181d;--ink2:#555b66;--line:rgba(0,0,0,.1);--amber:#a86a00;--green:#127a55;--red:#b42318;--mark:rgba(168,106,0,.14)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.col{max-width:760px;margin:0 auto;padding:28px 16px 64px}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.mast b{font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}
.mast span{font-size:13px;color:var(--ink2)}
h1{font:400 30px/1.2 Georgia,"Times New Roman",serif;margin:22px 0 6px}
.sentence{font-size:18px;color:var(--ink2);margin:0 0 18px}
.sentence em{font-style:normal;color:var(--amber)}
.log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 22px;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--ink2);min-height:3.4em}
.log div{opacity:0;transform:translateY(3px);transition:opacity .35s,transform .35s}
.log div.on{opacity:1;transform:none}
.log .head{color:var(--ink);text-transform:uppercase;letter-spacing:.08em;font-size:11px;margin-top:6px}
.bar{display:flex;gap:10px;align-items:center;margin:0 0 18px}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.edition{display:none}
.edition.on{display:block}
.meta{font-size:14px;color:var(--ink2);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;margin:0 0 16px}
.card h2{font:400 22px/1.3 Georgia,"Times New Roman",serif;margin:6px 0 10px}
.chip{display:inline-block;font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:4px 8px}
.s-supported{color:var(--green)}.s-partial{color:var(--amber)}.s-unsupported,.s-unchecked{color:var(--red)}
.why{margin:0 0 8px}
.card ul{margin:0 0 10px;padding-left:20px}
.card li{margin:0 0 4px}
mark{background:var(--mark);color:inherit;border-bottom:1px solid var(--amber);padding:0 1px}
sup{font:600 11px ui-monospace,Menlo,Consolas,monospace;color:var(--amber);margin-left:1px}
.cites{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:14px;color:var(--ink2)}
.cites ol{margin:0;padding-left:20px}
.cites li{margin:0 0 8px}
.cites a{color:var(--ink)}
.fp{font:12px ui-monospace,Menlo,Consolas,monospace}
.conn{border-left:3px solid var(--amber);padding:2px 0 2px 12px;margin:0 0 18px;color:var(--ink2)}
.foot{font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px;margin-top:22px}
form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 20px;display:none}
form.on{display:block}
form label{display:block;font-size:14px;margin:0 0 8px}
form input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}
form fieldset{border:0;padding:0;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px 16px}
.err{color:var(--red);font-size:14px}
@media (prefers-reduced-motion:reduce){.log div{transition:none}}
</style>
</head><body><div class="col">
<header class="mast"><b>lensmith composer</b><span>a recorded brief, replayed</span></header>
<p class="sentence">Compose from <em id="sentence-sources"></em> through the lens <em id="sentence-lens"></em>.</p>
<form id="compose" autocomplete="off">
<fieldset id="picks"><legend class="meta">Sources</legend></fieldset>
<label>Lens <input type="text" name="lens" maxlength="300" required placeholder="what to look for, e.g. what this means for small teams"></label>
<button type="submit">Compose</button> <span id="err" class="err" role="alert"></span>
</form>
<div class="bar"><button type="button" id="replay">Replay</button><span class="meta">Nothing is composed here: this replays a brief written earlier.</span></div>
<div class="log" id="log" aria-live="polite"></div>
<main class="edition" id="edition"></main>
</div>
<script type="application/json" id="edition-data">{"schema": "composer-edition/v1", "recorded": true, "about": "A brief composed on 2026-10-25 from the two bundled feeds, kept so `composer demo` can replay it with no key and no network. It holds our own words, the cited article titles and links, the verdicts, and SHA-256 digests of the passages checked. It holds none of the articles' text.", "lens": "system improvements", "composed_on": "2026-10-25", "seconds": 98, "sources": [{"label": "Google AI blog", "items": 5, "status": "ok"}, {"label": "Google DeepMind blog", "items": 5, "status": "ok"}], "cards": [{"insight": "Model capability and safety need paired release tracks", "why": "Google AI presents Gemini 4 Argon as a hard-problem solver, while DeepMind separately foregrounds responsible and safe development.", "details": ["The two posts were published on the same day and concern Gemini 4 Argon.", "A capability announcement alone does not establish operational safety or deployment readiness.", "A separate safety account creates a clearer review trail for system operators.", "The feed descriptions do not disclose the specific evaluations, thresholds, or mitigations used."], "state": "partial", "citations": [{"label": "Google AI blog", "title": "Gemini 4 Argon: Built to solve your hardest problems", "url": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-argon/", "field": "why", "start": 0, "end": 58, "relation": "says", "window_sha256": "5b69f09bc61f1be093aee6c4355d6cf9f2affbf63aa2c68545f4e79ca2efeb79"}, {"label": "Google DeepMind blog", "title": "Developing Gemini 4 Argon responsibly and safely", "url": "https://deepmind.google/blog/developing-gemini-4-argon-responsibly-and-safely/", "field": "why", "start": 66, "end": 131, "relation": "says", "window_sha256": "f030a5c361c38615e93edc45fdf40b54badbc0ec4fd07d844882c6cee5e02e2a"}]}, {"insight": "Privacy-preserving inference can reduce data-exposure risk", "why": "Single source: DeepMind describes lightweight on-device scam detection with zero cloud data egress, making data location an explicit system design choice.", "details": ["The described system processes private-chat scam signals on the device.", "Zero cloud data egress reduces one category of exposure from centralized processing.", "Lightweight models indicate that privacy constraints can shape model and deployment selection.", "The description does not establish accuracy, false-positive rates, or device coverage."], "state": "supported", "citations": [{"label": "Google DeepMind blog", "title": "Google DeepMind and Singapore Government collaborate to build fine-tuned AI model for scam detection", "url": "https://deepmind.google/blog/on-device-ai-scam-detection-mddi/", "field": "details[1]", "start": 0, "end": 84, "relation": "says", "window_sha256": "2bdce5d08cd3ec0612d143cb568b43a949dabb4fcbeaf4cc1e791ee36e43ff93"}]}, {"insight": "Automation should accelerate search, not replace validation", "why": "Single source: DeepMind frames Google Antigravity as accelerating the search for antimicrobial peptides, which supports using agents to narrow costly investigation spaces.", "details": ["The stated role is discovery acceleration rather than confirmed scientific outcome.", "Search acceleration is useful when candidate spaces are too large for manual review.", "Agentic systems need explicit handoffs from generated candidates to domain validation.", "The description does not state how candidates were tested or compared with non-agent methods."], "state": "partial", "citations": [{"label": "Google DeepMind blog", "title": "Accelerating the search for antimicrobial peptides with Google Antigravity", "url": "https://deepmind.google/blog/accelerating-antimicrobial-discovery/", "field": "why", "start": 15, "end": 103, "relation": "says", "window_sha256": "d9fa6ad85e121af2b7e193cfd1da0c06a048469506eb51e601d125391b5fa7f6"}]}, {"insight": "Fine-grained outputs demand equally fine-grained quality checks", "why": "Single source: DeepMind's forest mapping post describes classification for every 10-meter land patch, where aggregate success can hide consequential local errors.", "details": ["The announced output is a global map of distinct forest types.", "Ten-meter resolution creates a large number of individual classifications to govern.", "Operators should validate both aggregate performance and localized edge cases.", "The feed description does not provide accuracy measures, error patterns, or update procedures."], "state": "partial", "citations": [{"label": "Google DeepMind blog", "title": "Beyond tree cover: mapping the world’s forest types", "url": "https://deepmind.google/blog/beyond-tree-cover-mapping-the-worlds-forest-types/", "field": "details[0]", "start": 26, "end": 61, "relation": "says", "window_sha256": "5b6e82d2a96b985391c133964b5a663ab2cab5c08a35681a9668d38def6ed37c"}]}, {"insight": "Experimental creation tools need clear boundary labels", "why": "Single source: Google's Playground announcement calls the gaming platform experimental, a useful signal that users should distinguish exploration from production workflow.", "details": ["The product is presented as a way to create and play custom games.", "Calling a system experimental sets expectations about maturity and operational guarantees.", "Teams should avoid silently promoting exploratory tools into critical paths.", "The feed description does not specify data handling, reliability targets, or export controls."], "state": "partial", "citations": [{"label": "Google AI blog", "title": "Introducing Playground: Create and play custom games", "url": "https://blog.google/innovation-and-ai/technology/ai/playground-experimental-gaming-platform/", "field": "details[1]", "start": 0, "end": 90, "relation": "implies", "window_sha256": "adcb7ceba70a08ecdf9a3cacfd37f50e3f6ef9272d8b86d8e3ac5aa8f93143c5"}]}], "check": {"tool": "claim-seal", "status": "ok", "rows": 6, "agree": 6, "note": "The brief was checked when it was written. claim-seal was then run again on the recorded judge answers: 6 of 6 checks agree."}, "model": {"name": "gpt-5.6-terra", "provider": "written and checked by gpt-5.6-terra (OpenAI)", "calls": 7, "input_tokens": 37489, "output_tokens": 4065, "split": {"write": {"calls": 1, "input_tokens": 5144, "output_tokens": 1627}, "check": {"calls": 6, "input_tokens": 32345, "output_tokens": 2438}}, "note": "Run on a flat-rate plan before this repository had its own API-key layer; token counts are that model's."}}</script>
<script type="application/json" id="page-config">{"live": false, "sources": []}</script>
<script>/* Lensmith Composer page: plays a brief's steps, then shows the brief.
   It reads the brief from the JSON block in this page (id "edition"); it fetches nothing,
   except in live mode (served by `composer serve`), where the form posts to /api/compose.
   Every piece of text is set with textContent, never as HTML. */
(function () {
  'use strict';
  var STATE = { supported: 'supported', partial: 'partly supported', unsupported: 'not supported', unchecked: 'not checked' };
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers = [];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function json(id) {
    var node = document.getElementById(id);
    return node ? JSON.parse(node.textContent) : null;
  }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
  function labels(ed) { return ed.sources.map(function (s) { return s.label; }); }

  function steps(ed) {
    var n = ed.cards.length, tally = {};
    ed.cards.forEach(function (c) { tally[c.state] = (tally[c.state] || 0) + 1; });
    var out = [['composition - sources', 'compose started · ' + plural(ed.sources.length, 'source') + ' · lens: ' + ed.lens]];
    ed.sources.forEach(function (s) {
      out.push(['', 'reading ' + s.label + ' · ' + plural(s.items, 'item') + (s.status === 'ok' ? ' (ok)' : ' (failed)')]);
    });
    out.push(['composition - screening', 'source text screened, prompt assembled']);
    out.push(['composition - lens', 'writing through the lens']);
    out.push(['', 'brief written · ' + plural(n, 'insight')]);
    out.push(['composition - checking', 'checking each claim against the articles it cites']);
    out.push(['', 'checked · ' + Object.keys(tally).map(function (k) { return tally[k] + ' ' + STATE[k]; }).join(' · ')]);
    return out;
  }

  /* Split `text` (counted in code points, as claim-seal counts) into plain runs and marked spans. */
  function marked(text, spans) {
    var chars = Array.from(text || ''), frag = document.createDocumentFragment(), at = 0;
    spans.slice().sort(function (a, b) { return a.start - b.start; }).forEach(function (s) {
      if (s.start < at || s.end > chars.length || s.start >= s.end) return;
      if (s.start > at) frag.appendChild(document.createTextNode(chars.slice(at, s.start).join('')));
      var m = el('mark', '', chars.slice(s.start, s.end).join(''));
      frag.appendChild(m);
      frag.appendChild(el('sup', '', s.n));
      at = s.end;
    });
    if (at < chars.length) frag.appendChild(document.createTextNode(chars.slice(at).join('')));
    return frag;
  }

  function card(c, i) {
    var box = el('article', 'card');
    var spans = {};
    c.citations.forEach(function (x, k) {
      if (x.field) (spans[x.field] = spans[x.field] || []).push({ start: x.start, end: x.end, n: k + 1 });
    });
    var head = el('div');
    head.appendChild(el('span', 'chip s-' + c.state, STATE[c.state] || c.state));
    head.appendChild(document.createTextNode(' '));
    head.appendChild(el('span', 'meta', (i === 0 ? 'The insight' : 'Insight ' + (i + 1)) + ' · ' + plural(c.citations.length, 'source')));
    box.appendChild(head);
    var h = el('h2');
    h.appendChild(marked(c.insight, spans.insight || []));
    box.appendChild(h);
    var why = el('p', 'why');
    why.appendChild(marked(c.why, spans.why || []));
    box.appendChild(why);
    if (c.details && c.details.length) {
      var ul = el('ul');
      c.details.forEach(function (d, k) {
        var li = el('li');
        li.appendChild(marked(d, spans['details[' + k + ']'] || []));
        ul.appendChild(li);
      });
      box.appendChild(ul);
    }
    var cites = el('div', 'cites');
    cites.appendChild(el('div', '', 'Sources and seals'));
    var ol = el('ol');
    c.citations.forEach(function (x) {
      var li = el('li');
      li.appendChild(el('span', '', x.label + (x.relation ? ' ' + x.relation + ' this' : '') + ': '));
      if (x.url && /^https?:\/\//i.test(x.url)) {
        var a = el('a', '', x.title || x.url);
        a.href = x.url;
        a.rel = 'noreferrer noopener';
        li.appendChild(a);
      } else {
        li.appendChild(el('span', '', x.title));
      }
      if (x.window_sha256) li.appendChild(el('div', 'fp', 'passage fingerprint ' + x.window_sha256.slice(0, 12)));
      ol.appendChild(li);
    });
    cites.appendChild(ol);
    box.appendChild(cites);
    return box;
  }

  function render(ed) {
    var root = document.getElementById('edition');
    root.textContent = '';
    if (!ed.cards.length) return;
    root.appendChild(el('h1', '', ed.cards[0].insight));
    root.appendChild(el('p', 'meta', plural(ed.cards.length, 'insight') + ' from ' + labels(ed).join(', ')
      + ' through the lens “' + ed.lens + '” · ' + ed.composed_on));
    if (ed.connection) {
      var cn = el('p', 'conn', 'Connection (' + (ed.connection.confidence || '?') + ', ' + (STATE[ed.connection.state] || 'not checked')
        + '): ' + ed.connection.headline);
      root.appendChild(cn);
    }
    if (ed.honest_note) root.appendChild(el('p', 'conn', 'Note from the writer: ' + ed.honest_note));
    ed.cards.forEach(function (c, i) { root.appendChild(card(c, i)); });
    var foot = el('div', 'foot');
    var chk = ed.check || {};
    foot.appendChild(el('p', '', chk.note || ('Checked with ' + (chk.tool || 'claim-seal') + ': ' + plural(chk.rows || 0, 'sealed row')
      + (chk.seal_verified ? ', seal verified' : ''))));
    var m = ed.model || {};
    var cost = plural(m.calls || 0, 'model call');
    if (typeof m.input_tokens === 'number') cost += ' · ' + m.input_tokens.toLocaleString('en') + ' input and '
      + m.output_tokens.toLocaleString('en') + ' output tokens';
    foot.appendChild(el('p', '', cost + (m.provider ? ' · ' + m.provider : '')));
    root.appendChild(foot);
  }

  function play(ed) {
    timers.forEach(clearTimeout);
    timers = [];
    var log = document.getElementById('log'), root = document.getElementById('edition');
    log.textContent = '';
    root.classList.remove('on');
    document.getElementById('sentence-sources').textContent = labels(ed).join(' and ');
    document.getElementById('sentence-lens').textContent = ed.lens;
    render(ed);
    var lines = steps(ed), beat = reduced ? 0 : 650;
    lines.forEach(function (pair, k) {
      var add = function () {
        if (pair[0]) log.appendChild(el('div', 'head on', pair[0]));
        var d = el('div', '', pair[1]);
        log.appendChild(d);
        if (beat) requestAnimationFrame(function () { d.classList.add('on'); }); else d.classList.add('on');
      };
      if (beat) timers.push(setTimeout(add, k * beat)); else add();
    });
    var show = function () { root.classList.add('on'); };
    if (beat) timers.push(setTimeout(show, lines.length * beat + 200)); else show();
  }

  function live(cfg) {
    var form = document.getElementById('compose');
    var box = document.getElementById('picks');
    cfg.sources.forEach(function (s, k) {
      var lab = el('label');
      var cb = el('input');
      cb.type = 'checkbox';
      cb.name = 'source';
      cb.value = s.id;
      cb.checked = k < 2;
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(' ' + s.label));
      box.appendChild(lab);
    });
    form.classList.add('on');
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var err = document.getElementById('err');
      err.textContent = '';
      var ids = Array.from(form.querySelectorAll('input[name=source]:checked')).map(function (x) { return x.value; });
      var body = { sources: ids, lens: form.elements.lens.value };
      var btn = form.querySelector('button');
      btn.disabled = true;
      document.getElementById('log').textContent = 'composing (this takes a minute or two)...';
      var headers = { 'content-type': 'application/json', 'x-composer-csrf': 'same-origin' };
      if (form.elements.pass && form.elements.pass.value) headers['x-composer-pass'] = form.elements.pass.value;
      fetch('/api/compose', { method: 'POST', headers: headers, body: JSON.stringify(body) })
        .then(function (r) { return r.json().then(function (j) { return [r.ok, j]; }); })
        .then(function (res) {
          btn.disabled = false;
          if (!res[0]) { err.textContent = res[1].error || 'the brief could not be composed'; document.getElementById('log').textContent = ''; return; }
          play(res[1]);
        })
        .catch(function () { btn.disabled = false; err.textContent = 'the server did not answer'; });
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    var ed = json('edition-data'), cfg = json('page-config') || {};
    document.getElementById('replay').addEventListener('click', function () { play(ed); });
    if (cfg.live) live(cfg);
    play(ed);
  });
})();
</script>
</body></html>
