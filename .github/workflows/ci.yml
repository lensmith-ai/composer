# Every push to main and every pull request: the offline test suite on three systems and the two ends of the
# Python range we claim, the real one-command install on macOS (BSD userland), the banned-text test over the whole
# history, a secret scan, and a lint of these workflows.
# Every action is pinned by full commit SHA (the tag is in the comment); every downloaded tool by version + SHA-256.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (fetches claim-seal at its pinned commit; pip checks its SHA-256)
        run: python -m pip install .
      - name: Offline tests
        run: python -m unittest discover -s tests -t tests -v

  install-macos:
    # The one-command install, run for real on a Mac (BSD userland: its chmod, sed, find, stat and tar are not GNU's, and
    # every other test runs on Linux). Built the way the release builds it, then installed from those local files
    # (COMPOSER_FILES_DIR, no download of Composer's own files): the command a person types, then a second run (the
    # "already installed" path), then `lensmith composer --version` and `doctor`.
    name: one-command install on macOS (${{ matrix.case }})
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: python.org Python, default folder
            templates: as-shipped
            home: default
          - case: group-writable venv templates, own folder
            templates: group-writable
            home: own
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Release tools (hash-locked), then the release files and install.sh as the release makes them
        run: |
          python -m pip install --require-hashes -r scripts/release/release-tools.txt
          python scripts/release/build.py --out "$RUNNER_TEMP/dist"
          python scripts/release/make_installer.py --dist "$RUNNER_TEMP/dist" --out "$RUNNER_TEMP/installer"
          mkdir "$RUNNER_TEMP/kit"
          cp "$RUNNER_TEMP/dist"/lensmith_composer-* "$RUNNER_TEMP/installer"/* "$RUNNER_TEMP/kit/"
          ls -l "$RUNNER_TEMP/kit"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Which Python the installer will find (python.org's installer build when this runner has it)
        run: |
          fw=/Library/Frameworks/Python.framework/Versions/3.12/bin
          if [ -x "$fw/python3" ]; then echo "$fw" >> "$GITHUB_PATH"; echo "python.org framework Python: $fw/python3"; else echo "no /Library framework Python on this runner; using setup-python's"; fi
          python3 -c 'import sys, sysconfig; print(sys.executable, sys.version.split()[0], "framework=" + str(sysconfig.get_config_var("PYTHONFRAMEWORK")))'
      - name: Make the venv templates group-writable, as python.org's installer leaves them
        if: matrix.templates == 'group-writable'
        run: |
          d=$(python3 -c 'import os, venv; print(os.path.join(os.path.dirname(venv.__file__), "scripts"))')
          sudo chmod -R g+w "$d"
          ls -ld "$d" "$d"/common/* | head
      - name: One-command install from local files
        env:
          WHICH_HOME: ${{ matrix.home }}
        run: |
          cd "$RUNNER_TEMP/kit"
          if [ "$WHICH_HOME" = own ]; then H="$RUNNER_TEMP/composer-home"; else H="$HOME/.lensmith-composer"; fi
          echo "H=$H" >> "$GITHUB_ENV"
          COMPOSER_FILES_DIR="$PWD" sh install.sh --home "$H" --no-open --no-start --path
      - name: The same command again (already installed)
        run: |
          cd "$RUNNER_TEMP/kit"
          COMPOSER_FILES_DIR="$PWD" sh install.sh --home "$H" --no-open --no-start --path
      - name: lensmith composer --version and doctor
        run: |
          "$H/bin/lensmith" composer --version
          "$H/bin/lensmith" composer doctor
          echo "MACOS-INSTALL-PROOF: ok | ${{ matrix.case }} | $("$H/bin/lensmith" composer --version) | $(uname -sm) macOS $(sw_vers -productVersion) | $(python3 -c 'import sys; print("Python " + sys.version.split()[0])')"

  banned-text:
    name: banned-text test (tree and full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Banned text, names, paths and key shapes
        run: python -m unittest discover -s tests -t tests -p test_banned.py -v

  gitleaks:
    name: secret scan (gitleaks, history and tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version and SHA-256)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact -v .'
      - name: Scan the working tree
        run: '"$RUNNER_TEMP/gitleaks" dir --no-banner --redact -v .'

  workflows:
    name: lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned version and SHA-256)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: actionlint (runs shellcheck on every run block)
        run: '"$RUNNER_TEMP/actionlint" -color'
