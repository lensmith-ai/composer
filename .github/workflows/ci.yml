# Every push to main and every pull request: the offline test suite on three systems and the two ends of the
# Python range we claim, the real one-command install on macOS (BSD userland), the banned-text test over the whole
# history, a secret scan, and a lint of these workflows.
# Every action is pinned by full commit SHA (the tag is in the comment); every downloaded tool by version + SHA-256.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (fetches claim-seal at its pinned commit; pip checks its SHA-256)
        run: python -m pip install .
      - name: Offline tests
        run: python -m unittest discover -s tests -t tests -v

  install-macos:
    # The one-command install, run for real on a Mac (BSD userland: its chmod, sed, find, stat, tar and awk are not GNU's,
    # and every other test runs on Linux). Built the way the release builds it, then installed from those local files
    # (COMPOSER_FILES_DIR): the command a person types; the same command again ("already installed"); an interrupted
    # install (a half-made version folder with read-only folders and its marker) and the rerun that removes it; then
    # `lensmith composer --version`, `doctor`, and `uninstall` with its shell-profile lines taken away again.
    # Case 3 has no usable Python on PATH, so the installer fetches uv and a private Python (the download path).
    name: one-command install on macOS (${{ matrix.case }})
    runs-on: macos-14
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: Python from setup-python, default folder
            templates: as-shipped
            home: default
            path: inherit
          - case: group-writable venv templates, own folder
            templates: group-writable
            home: own
            path: inherit
          - case: no Python on PATH, private Python through uv
            templates: as-shipped
            home: own
            path: bare
    env:
      CASE: ${{ matrix.case }}
      TEMPLATES: ${{ matrix.templates }}
      WHICH_HOME: ${{ matrix.home }}
      WHICH_PATH: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Release tools (hash-locked), then the release files and install.sh as the release makes them
        run: |
          python -m pip install --require-hashes -r scripts/release/release-tools.txt
          python scripts/release/build.py --out "$RUNNER_TEMP/dist"
          python scripts/release/make_installer.py --dist "$RUNNER_TEMP/dist" --out "$RUNNER_TEMP/installer"
          mkdir "$RUNNER_TEMP/kit"
          cp "$RUNNER_TEMP/dist"/lensmith_composer-* "$RUNNER_TEMP/installer"/* "$RUNNER_TEMP/kit/"
          find "$RUNNER_TEMP/kit" -type f -exec ls -l {} +
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Which Python the installer will find (python.org's installer build when this runner has it)
        run: |
          fw=/Library/Frameworks/Python.framework/Versions/3.12/bin
          if [ -x "$fw/python3" ]; then echo "$fw" >> "$GITHUB_PATH"; echo "python.org framework Python: $fw/python3"; else echo "no /Library framework Python on this runner; using setup-python's"; fi
          python3 -c 'import sys, sysconfig; print(sys.executable, sys.version.split()[0], "framework=" + str(sysconfig.get_config_var("PYTHONFRAMEWORK")))'
      - name: Make the venv templates group-writable, as python.org's installer leaves them
        if: matrix.templates == 'group-writable'
        run: |
          d=$(python3 -c 'import os, venv; print(os.path.join(os.path.dirname(venv.__file__), "scripts"))')
          sudo chmod -R g+w "$d"
          find "$d" -maxdepth 2 -type f -exec ls -l {} +
      - name: One-command install from local files
        run: |
          cd "$RUNNER_TEMP/kit"
          if [ "$WHICH_HOME" = own ]; then H="$RUNNER_TEMP/composer-home"; else H="$HOME/.lensmith-composer"; fi
          echo "H=$H" >> "$GITHUB_ENV"
          if [ "$WHICH_PATH" = bare ]; then
            # no Python 3.10+ anywhere the installer looks: it must fetch uv and a private Python, as on a fresh Mac
            COMPOSER_PYTHON_PATH_ONLY=1 COMPOSER_FILES_DIR="$PWD" PATH=/usr/bin:/bin:/usr/sbin:/sbin sh install.sh --home "$H" --no-open --no-start --path
          else
            COMPOSER_FILES_DIR="$PWD" sh install.sh --home "$H" --no-open --no-start --path
          fi
      - name: The same command again (already installed)
        run: |
          cd "$RUNNER_TEMP/kit"
          if [ "$WHICH_PATH" = bare ]; then export COMPOSER_PYTHON_PATH_ONLY=1 PATH=/usr/bin:/bin:/usr/sbin:/sbin; fi
          COMPOSER_FILES_DIR="$PWD" sh install.sh --home "$H" --no-open --no-start --path 2>&1 | tee "$RUNNER_TEMP/rerun.txt"
          grep -q "is already installed in" "$RUNNER_TEMP/rerun.txt"
      - name: An interrupted install, then the rerun that removes what it left
        run: |
          cd "$RUNNER_TEMP/kit"
          if [ "$WHICH_PATH" = bare ]; then export COMPOSER_PYTHON_PATH_ONLY=1 PATH=/usr/bin:/bin:/usr/sbin:/sbin; fi
          v=$(sed -n 's/^version = "\([0-9][0-9A-Za-z.+_-]*\)"$/\1/p' "$GITHUB_WORKSPACE/pyproject.toml" | head -n 1)
          mv "$H/app/current" "$RUNNER_TEMP/current.moved"
          : > "$H/app/.making-$v"
          find "$H/app/$v" -type d -exec chmod 555 {} +
          COMPOSER_FILES_DIR="$PWD" sh install.sh --home "$H" --no-open --no-start --path 2>&1 | tee "$RUNNER_TEMP/rerun2.txt"
          grep -q "an earlier setup stopped in the middle of making" "$RUNNER_TEMP/rerun2.txt"
          test -L "$H/app/current"
      - name: lensmith composer --version and doctor
        run: |
          v=$(sed -n 's/^version = "\([0-9][0-9A-Za-z.+_-]*\)"$/\1/p' pyproject.toml | head -n 1)
          said=$("$H/bin/lensmith" composer --version)
          echo "$said"
          test "$said" = "composer $v"
          "$H/bin/lensmith" composer doctor | tee "$RUNNER_TEMP/doctor.txt"
          grep -q ", 0 failed" "$RUNNER_TEMP/doctor.txt"
          echo "MACOS-INSTALL-PROOF: ok | $CASE | $said | $(grep 'passed, 0 failed' "$RUNNER_TEMP/doctor.txt") | $(uname -sm) macOS $(sw_vers -productVersion) | $("$H"/app/current/venv/bin/python -c 'import sys; print("Python " + sys.version.split()[0])')"
      - name: lensmith composer uninstall takes its shell-profile lines away
        run: |
          # (cat, not grep on three names: grep exits 2 when one of the profiles does not exist)
          cat "$HOME/.zshrc" "$HOME/.bash_profile" "$HOME/.profile" 2>/dev/null | grep -q "added by the Composer installer"
          "$H/bin/lensmith" composer uninstall
          if cat "$HOME/.zshrc" "$HOME/.bash_profile" "$HOME/.profile" 2>/dev/null | grep -q "added by the Composer installer"; then echo "the lensmith lines are still in a profile"; exit 1; fi
          test ! -e "$H/bin/composer"

  banned-text:
    name: banned-text test (tree and full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Banned text, names, paths and key shapes
        run: python -m unittest discover -s tests -t tests -p test_banned.py -v

  gitleaks:
    name: secret scan (gitleaks, history and tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version and SHA-256)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact -v .'
      - name: Scan the working tree
        run: '"$RUNNER_TEMP/gitleaks" dir --no-banner --redact -v .'

  workflows:
    name: lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned version and SHA-256)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: actionlint (runs shellcheck on every run block)
        run: '"$RUNNER_TEMP/actionlint" -color'
