# A release is built from the owner's SIGNED tag v<version> (equal to pyproject.toml's version, on a commit on main).
# It runs when such a tag is pushed, or by hand (Actions, release, Run workflow, branch main, tag = an existing tag such
# as v0.2.0), so a tag that is already pushed can be released without moving it. The jobs:
#   verify-tag    the tag is annotated, names itself, points at the checked-out commit, is on main, carries a good
#                 signature from the owner's key (.github/allowed_signers as it stands on main), matches
#                 pyproject.toml, and has no release yet. Every other job needs it and builds from that tag.
#   test          the offline suite on Linux, recorded as test-results.json
#   build         sdist + wheel with hash-locked tools; the wheel installed into an empty venv and run;
#                 a CycloneDX SBOM of that venv (+ the optional narration parts, scope "excluded"); SHA256SUMS
#   installer     install.sh for this release (every file it fetches pinned by SHA-256) and the dependency files it
#                 may fetch from the release, made from the build job's files
#   release-note  the note: re-verifies, offline, the claim-seal check made on the maintainer's computer before the tag;
#                 a note, changelog entry or seal that changed after sealing stops the release (no model, no secret)
#   image         the default image (no narration) for linux/amd64 and linux/arm64, pushed to ghcr.io ONLY under an
#                 unreleased candidate tag (candidate-<commit>), its SBOM (syft, CycloneDX) and both attested to the
#                 image digest. A candidate tag is a staging image, not a release: nothing names it as one.
#   promote       the release's own image tag (<version>) is put on the candidate's digest only here, after test,
#                 build, release-note and image (with its attestations) are all green
#   publish       GitHub artifact attestations (build provenance for every file built here, SBOM for the wheel and sdist),
#                 then the GitHub Release
#                 (made as a draft, published only when every file is attached)
#   installer-to-main   after the release: commits install.sh to main, where the one-line install is served from
# Nothing is published unless every job before it is green. Write permissions exist only in the jobs that need them.
name: release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (for example v0.2.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    # A manual run must start from main, so the workflow that holds write access is the reviewed one.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # The tag arrives through the environment, never pasted into a script.
      REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      commit: ${{ steps.check.outputs.commit }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check the tag name
        id: tag
        run: |
          # bash matches the whole value, so a value with a newline in it cannot slip through.
          if ! [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::tag must be exactly vMAJOR.MINOR.PATCH, or with a pre-release ending such as rc1"; exit 1
          fi
          echo "name=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          fetch-depth: 0   # full history and the tag object, to check the tag against main
          persist-credentials: false
      - name: Check the tag is a signed, annotated tag on a commit on main
        id: check
        env:
          TAG: ${{ steps.tag.outputs.name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ] \
            || { echo "::error::$TAG is a lightweight tag; releases need an annotated, signed tag"; exit 1; }
          [ "$(git cat-file tag "refs/tags/$TAG" | sed -n 's/^tag //p')" = "$TAG" ] \
            || { echo "::error::the tag object inside $TAG names a different tag"; exit 1; }
          COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          [ "$(git rev-parse HEAD)" = "$COMMIT" ] \
            || { echo "::error::checked-out commit is not the tag's commit"; exit 1; }
          if [ "$EVENT_NAME" = "push" ] && [ "$EVENT_SHA" != "$COMMIT" ]; then
            echo "::error::the tag moved between the push and this run"; exit 1
          fi
          git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null \
            || { echo "::error::origin/main is missing from the checkout"; exit 1; }
          git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main \
            || { echo "::error::$TAG ($COMMIT) is not on main"; exit 1; }
          # The signature is checked against the owner's key as it stands on main, not against a
          # key file carried by the tag's own tree.
          git show refs/remotes/origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" tag -v "$TAG"
          VERSION=${TAG#v}
          python3 - "$VERSION" "$TAG" <<'PY'
          import sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          sys.exit(0 if version == sys.argv[1] else "pyproject version %s does not match tag %s" % (version, sys.argv[2]))
          PY
          {
            echo "commit=$COMMIT"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: Stop if this tag already has a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$TAG already has a release; delete it first if it must be rebuilt"; exit 1
          fi

  test:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - name: Offline tests, recorded
        run: python scripts/release/test_results.py --out test-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results.json
          if-no-files-found: error

  build:
    needs: [verify-tag, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Release tools (hash-locked)
        run: python -m pip install --require-hashes -r scripts/release/release-tools.txt
      - name: Build, install, run, SBOM, checksums
        run: python scripts/release/build.py --out dist --tag "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  installer:
    # install.sh for this release: every file it fetches is pinned by SHA-256 to the files made here. The dependency
    # files (certifi's and setuptools' wheels, claim-seal's pinned archive and the wheel built from it) are each
    # checked against a hash written in the repository before they are used.
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Release tools (hash-locked)
        run: python -m pip install --require-hashes -r scripts/release/release-tools.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: install.sh and its dependency files
        run: python scripts/release/make_installer.py --dist dist --out installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: installer/
          if-no-files-found: error

  release-note:
    # No model key and no secret here. The note was checked by claim-seal once, on the maintainer's own computer before the
    # tag (scripts/seal-release-note.sh), and the sealed result is committed (release-notes/<version>.sealed.json). This job
    # only re-verifies that saved seal offline, and fails if the note, the changelog entry or the seal changed after it.
    needs: [verify-tag, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - name: Re-verify the sealed release note (offline)
        run: |
          version="${TAG#v}"
          python scripts/release/release_note.py verify --version "$version" --draft "release-notes/$version.json" \
            --sealed "release-notes/$version.sealed.json" --out-dir note
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: note
          path: note/
          if-no-files-found: error

  image:
    needs: [verify-tag, test, build, release-note]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}
      COMMIT: ${{ needs.verify-tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tags
        id: name
        run: |
          {
            echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "version=${TAG#v}"
            echo "candidate=candidate-${COMMIT}"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push the default image (no narration) under its candidate tag only
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: default
          platforms: linux/amd64,linux/arm64
          build-args: COMPOSER_VERSION=${{ steps.name.outputs.version }}
          tags: ${{ steps.name.outputs.ref }}:${{ steps.name.outputs.candidate }}
          push: true
      - name: Image SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.name.outputs.ref }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: image.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.name.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: image.cdx.json
          push-to-registry: true
      - name: Keep the image digest and SBOM for the release
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REF: ${{ steps.name.outputs.ref }}
        run: |
          mkdir -p image
          mv image.cdx.json "image/lensmith_composer-${TAG#v}-image.cdx.json"
          echo "$REF@$DIGEST" > "image/lensmith_composer-${TAG#v}-image-digest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image/
          if-no-files-found: error
    outputs:
      ref: ${{ steps.name.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}

  promote:
    # The only step that puts the release's version tag on an image, and only once every gate is green.
    needs: [verify-tag, test, build, installer, release-note, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}
      COMMIT: ${{ needs.verify-tag.outputs.commit }}
    steps:
      - name: The tag still points at the commit that was checked and built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)" = "tag" ] \
            || { echo "::error::$TAG is no longer an annotated tag"; exit 1; }
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          [ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .object.sha)" = "$COMMIT" ] \
            || { echo "::error::$TAG no longer points at $COMMIT"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the attested candidate digest with the release version (no rebuild)
        env:
          REF: ${{ needs.image.outputs.ref }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "no image digest from the image job" >&2; exit 1 ;; esac
          docker buildx imagetools create --tag "$REF:${TAG#v}" "$REF@$DIGEST"

  publish:
    needs: [verify-tag, test, build, installer, release-note, image, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}
      COMMIT: ${{ needs.verify-tag.outputs.commit }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: note
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: release
      - name: Version
        id: v
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Serial number for the wheel's SBOM
        # cyclonedx-py --output-reproducible leaves out serialNumber, and actions/attest refuses a CycloneDX file
        # without one ("Unsupported SBOM format", v0.2.0's first run). The serial is a UUIDv5 of the tag, so the
        # same tag always gets the same serial. Runs before SHA256SUMS and the attestations, which cover the result.
        working-directory: release
        env:
          SBOM: lensmith_composer-${{ steps.v.outputs.version }}.cdx.json
        run: |
          python3 - <<'PY'
          import json, os, uuid
          path = os.environ["SBOM"]
          with open(path, encoding="utf-8") as f:
              bom = json.load(f)
          if bom.get("bomFormat") != "CycloneDX":
              raise SystemExit(f"{path}: not a CycloneDX file")
          if not bom.get("serialNumber"):
              tag = os.environ["TAG"]
              bom = {"serialNumber": "urn:uuid:" + str(uuid.uuid5(uuid.NAMESPACE_URL,
                     f"https://github.com/lensmith-ai/composer/releases/tag/{tag}")), **bom}
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(bom, f, indent=2, sort_keys=True)
                  f.write("\n")
          print(path, bom["serialNumber"])
          PY
      - name: SHA256SUMS over every file attached to the release
        working-directory: release
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance for every file this workflow built or made
        # Not certifi's and setuptools' wheels or claim-seal's source archive: those are copies of upstream files,
        # checked against hashes written in this repository, and were not built here.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/lensmith_composer-${{ steps.v.outputs.version }}-py3-none-any.whl
            release/lensmith_composer-${{ steps.v.outputs.version }}.tar.gz
            release/lensmith_composer-${{ steps.v.outputs.version }}.cdx.json
            release/claim_seal-*-py3-none-any.whl
            release/install.sh
            release/install.sh.sha256
            release/install-pins.json
            release/release-note.md
            release/release-note-check.json
            release/lensmith_composer-${{ steps.v.outputs.version }}-image.cdx.json
            release/lensmith_composer-${{ steps.v.outputs.version }}-image-digest.txt
            release/SHA256SUMS
      - name: SBOM attestation for Composer's wheel and sdist
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            release/lensmith_composer-${{ steps.v.outputs.version }}-py3-none-any.whl
            release/lensmith_composer-${{ steps.v.outputs.version }}.tar.gz
          sbom-path: release/lensmith_composer-${{ steps.v.outputs.version }}.cdx.json
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${TAG#v}"
          pre=""
          case "$version" in *a*|*b*|*rc*) pre="--prerelease" ;; esac
          # The tag must still be what was checked and built.
          [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)" = "tag" ] \
            || { echo "::error::$TAG is no longer an annotated tag"; exit 1; }
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          [ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .object.sha)" = "$COMMIT" ] \
            || { echo "::error::$TAG no longer points at $COMMIT"; exit 1; }
          files=$(find release -maxdepth 1 -type f | wc -l)
          # A draft first, published once every file is attached, so a failed upload never leaves a public release
          # with files missing.
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft $pre \
            --title "Lensmith Composer $version" --notes-file release/release-note.md
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq "$files" ] \
            || { echo "::error::the draft release does not hold all $files files"; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  installer-to-main:
    # The one-line install is served from install.sh on main, and its pins are only known once the release's files
    # exist. After the release is public: put the release's own install.sh on main (one commit by github-actions).
    # If main refuses the commit (a branch rule), the release is already complete; commit the release's install.sh
    # by hand (docs/releasing.md).
    needs: [verify-tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}
    steps:
      - name: Download install.sh from the release and check it against the release's SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir inst
          cd inst
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern install.sh --pattern SHA256SUMS
          grep -E '^[0-9a-f]{64}  install\.sh$' SHA256SUMS > one.sum
          [ "$(wc -l < one.sum)" -eq 1 ]
          sha256sum -c one.sum
      - name: Commit install.sh to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd inst
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/install.sh?ref=main" --jq .sha 2>/dev/null || true)
          # gh prints an error body on stdout when the file does not exist yet; only a real blob id counts.
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] || current=""
          args=(-X PUT -f "message=install.sh for ${TAG#v}, made by the release workflow" -f "branch=main"
                -f "content=$(base64 -w0 install.sh)")
          [ -n "$current" ] && args+=(-f "sha=$current")
          gh api "repos/$GITHUB_REPOSITORY/contents/install.sh" "${args[@]}" --jq .commit.sha
          # The address people paste must now serve this file (the raw host can lag a few minutes).
          for _ in $(seq 1 54); do
            if curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh" | cmp -s - install.sh; then
              echo "install.sh is served from main"; exit 0
            fi
            sleep 10
          done
          echo "::error::raw.githubusercontent.com does not serve the new install.sh yet"; exit 1
