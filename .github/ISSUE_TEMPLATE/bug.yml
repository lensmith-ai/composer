name: Something broke
description: Composer did something wrong, crashed, or refused something it should accept.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The command you ran or the button you pressed, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Version and checks
      description: |
        Paste the output of `composer --version`. From 0.2 on, paste `composer doctor` instead: it never prints your key.
        Do not paste API keys, your login, or briefs you do not want public.
      render: text
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How you run it
      options:
        - On my computer (command line)
        - On my computer (web page)
        - Docker Compose with Caddy (docs/deploy-vps.md)
        - Something else
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and Python version
      placeholder: macOS 14 on Apple silicon, Python 3.13
