[build-system]
# One pinned build tool (the same version claim-seal pins). Composer itself has one runtime
# dependency: claim-seal, pinned to an exact commit below. It is fetched as GitHub's archive of
# that commit (so no git is needed on your machine), and pip checks the archive's SHA-256.
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lensmith-composer"
version = "0.2.0"
description = "Read a few feeds, write a short brief through a lens you choose, and check every claim against the article it cites."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "claim-seal @ https://github.com/lensmith-ai/claim-seal/archive/331d6a06a223c145e286a861c7f568cdb23cbefe.tar.gz#sha256=8d54d04b9bf1d93bc523f4dbef8500a090f826b531630081e0ec03f939319732",
]

[project.scripts]
composer = "composer.cli:main"

[tool.setuptools]
packages = ["composer", "composer.adapters", "composer.narration"]

[tool.setuptools.package-data]
composer = ["sources.json", "packages.json", "extraction-requirements.lock", "data/*.json", "web/*.css", "web/*.js", "web/window/*.css", "web/window/*.js",
            "web/app/*.html", "web/app/*.css", "web/app/*.js"]
"composer.narration" = ["requirements.lock"]
